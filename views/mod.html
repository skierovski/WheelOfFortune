<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Moderator Panel – Wheel of Fortune</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: dark; --accent: #7c3aed; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,58,237,0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(59,130,246,0.18), transparent 50%),
        linear-gradient(160deg, #0b0918 0%, #15102e 45%, #0f0c29 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 48px; }

    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }
    h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #a78bfa, #93c5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    .badge {
      display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(124,58,237,0.2); color: #c4b5fd;
      border: 1px solid rgba(124,58,237,0.35);
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }
    .lang-toggle {
      display: flex; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .lang-btn {
      padding: 6px 12px; background: rgba(255,255,255,0.04); color: #94a3b8;
      border: none; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .lang-btn.active { background: var(--accent); color: #fff; }

    .logout-btn, .btn {
      padding: 9px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0; cursor: pointer; font-size: 13px; font-weight: 600;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .btn:hover, .logout-btn:hover { background: rgba(255,255,255,0.12); }
    .btn:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { filter: brightness(1.12); }
    .btn-wide { width: 100%; justify-content: center; padding: 14px 18px; font-size: 15px; }
    .logout-btn:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.4); color: #f87171; }

    .card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(18px);
      margin-bottom: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #f1f5f9; }

    .muted { color: #94a3b8; font-size: 13px; }
    .small { font-size: 12px; }

    select, input[type="number"] {
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0; font-size: 14px; width: 100%;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat {
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 12px 14px;
    }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; margin-bottom: 4px; }
    .stat .value { font-size: 20px; font-weight: 800; color: #f8fafc; }

    .actions { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 120px; }

    #actionResult {
      display: none; margin-top: 12px; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-align: center;
    }
    #actionResult.ok { display: block; background: rgba(34,197,94,0.15); color: #86efac; }
    #actionResult.err { display: block; background: rgba(239,68,68,0.15); color: #fca5a5; }

    .empty { color: #64748b; font-style: italic; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1 data-i18n="title">Moderator Panel</h1>
        <div class="subtitle" id="channelSubtitle" data-i18n="subtitle">Live controls for the streamer’s wheel</div>
        <span class="badge" data-i18n="badge">MOD</span>
      </div>
      <div class="header-actions">
        <div class="lang-toggle">
          <button class="lang-btn active" id="langEn" type="button">EN</button>
          <button class="lang-btn" id="langPl" type="button">PL</button>
        </div>
        <a class="logout-btn" href="/auth/logout" data-i18n="logout">Logout</a>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="channel_title">Channel</h2>
      <select id="channelSelect"></select>
      <div class="muted small" style="margin-top:8px;" data-i18n="channel_hint">Pick which streamer you’re assisting.</div>
    </div>

    <div class="card" id="mainCard" style="display:none;">
      <h2 data-i18n="status_title">Status</h2>
      <div class="stats">
        <div class="stat"><div class="label" data-i18n="stat_pending">Pending spins</div><div class="value" id="statPending">—</div></div>
        <div class="stat"><div class="label" data-i18n="stat_delay">Delay</div><div class="value" id="statDelay">—</div></div>
        <div class="stat"><div class="label" data-i18n="stat_slots">Slots queue</div><div class="value" id="statSlots">—</div></div>
        <div class="stat"><div class="label" data-i18n="stat_counter">Counter</div><div class="value" id="statCounter">—</div></div>
      </div>

      <h2 data-i18n="actions_title">Actions</h2>
      <div class="actions">
        <button class="btn btn-accent btn-wide" id="testSpinBtn" type="button" data-i18n="btn_spin">Send Test Spin</button>
        <button class="btn btn-wide" id="resetDelayBtn" type="button" data-i18n="btn_reset">Reset Delay Timer</button>
        <div class="row">
          <div>
            <label class="muted small" for="giftCount" data-i18n="gift_label">Simulate gifted subs</label>
            <input type="number" id="giftCount" min="1" max="100" value="5" />
          </div>
          <button class="btn" id="sendGiftsBtn" type="button" data-i18n="btn_gifts">Send Gifts</button>
        </div>
        <div class="row">
          <button class="btn" id="counterPlusBtn" type="button" data-i18n="btn_counter_plus">Counter +1</button>
          <button class="btn" id="refreshBtn" type="button" data-i18n="btn_refresh">Refresh</button>
        </div>
      </div>
      <div id="actionResult"></div>
    </div>

    <div class="card" id="emptyCard">
      <div class="empty" data-i18n="empty">Loading channels…</div>
    </div>
  </div>

  <script>
    const I18N = {
      en: {
        title: "Moderator Panel",
        subtitle: "Live controls for the streamer’s wheel",
        badge: "MOD",
        logout: "Logout",
        channel_title: "Channel",
        channel_hint: "Pick which streamer you’re assisting.",
        status_title: "Status",
        actions_title: "Actions",
        stat_pending: "Pending spins",
        stat_delay: "Delay",
        stat_slots: "Slots queue",
        stat_counter: "Counter",
        btn_spin: "Send Test Spin",
        btn_reset: "Reset Delay Timer",
        gift_label: "Simulate gifted subs",
        btn_gifts: "Send Gifts",
        btn_counter_plus: "Counter +1",
        btn_refresh: "Refresh",
        empty: "No channels assigned. Ask the streamer to add your Kick account as a moderator.",
        loading: "Loading channels…",
      },
      pl: {
        title: "Panel moderatora",
        subtitle: "Sterowanie kołem na żywo dla streamera",
        badge: "MOD",
        logout: "Wyloguj",
        channel_title: "Kanał",
        channel_hint: "Wybierz streamera, któremu pomagasz.",
        status_title: "Status",
        actions_title: "Akcje",
        stat_pending: "Spinów w kolejce",
        stat_delay: "Opóźnienie",
        stat_slots: "Kolejka slotów",
        stat_counter: "Licznik",
        btn_spin: "Wyślij testowy spin",
        btn_reset: "Resetuj timer opóźnienia",
        gift_label: "Symuluj gifted suby",
        btn_gifts: "Wyślij gifty",
        btn_counter_plus: "Licznik +1",
        btn_refresh: "Odśwież",
        empty: "Brak przypisanych kanałów. Poproś streamera, żeby dodał Twoje konto Kick jako moderatora.",
        loading: "Ładowanie kanałów…",
      },
    };

    let lang = localStorage.getItem("mod_lang") || "en";
    let channels = [];
    let currentBid = null;

    function t(key) { return I18N[lang]?.[key] || I18N.en[key] || key; }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });
      document.getElementById("langEn").classList.toggle("active", lang === "en");
      document.getElementById("langPl").classList.toggle("active", lang === "pl");
    }

    function showResult(msg, ok = true) {
      const el = document.getElementById("actionResult");
      el.textContent = msg;
      el.className = ok ? "ok" : "err";
    }

    function fmtDelay(sec) {
      const s = Math.max(0, Number(sec) || 0);
      if (s <= 0) return "ready";
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m > 0 ? `${m}m ${r}s` : `${r}s`;
    }

    async function loadChannels() {
      const r = await fetch("/mod/channels", { cache: "no-store" });
      if (r.status === 401 || r.redirected) {
        location.href = "/auth/login?ret=/mod";
        return;
      }
      if (!r.ok) {
        document.getElementById("emptyCard").querySelector(".empty").textContent = t("empty");
        return;
      }
      const data = await r.json();
      channels = data.channels || [];
      const sel = document.getElementById("channelSelect");
      sel.innerHTML = "";
      if (!channels.length) {
        document.getElementById("mainCard").style.display = "none";
        document.getElementById("emptyCard").style.display = "block";
        document.getElementById("emptyCard").querySelector(".empty").textContent = t("empty");
        return;
      }
      document.getElementById("emptyCard").style.display = "none";
      document.getElementById("mainCard").style.display = "block";
      for (const ch of channels) {
        const opt = document.createElement("option");
        opt.value = ch.broadcaster_id;
        opt.textContent = ch.display_name || ch.username || `ID ${ch.broadcaster_id}`;
        sel.appendChild(opt);
      }
      const saved = localStorage.getItem("mod_bid");
      if (saved && channels.some((c) => String(c.broadcaster_id) === saved)) {
        sel.value = saved;
      }
      currentBid = Number(sel.value);
      localStorage.setItem("mod_bid", String(currentBid));
      await refreshStatus();
    }

    async function refreshStatus() {
      if (!currentBid) return;
      const r = await fetch(`/mod/${currentBid}/status`, { cache: "no-store" });
      if (!r.ok) {
        showResult("Failed to load status", false);
        return;
      }
      const d = await r.json();
      document.documentElement.style.setProperty("--accent", d.accent_color || "#7c3aed");
      document.getElementById("statPending").textContent = d.pending_spins;
      document.getElementById("statDelay").textContent = fmtDelay(d.time_until_next);
      document.getElementById("statSlots").textContent = d.slots_pending;
      document.getElementById("statCounter").textContent = `${d.counter.count}/${d.counter.goal}`;
      document.getElementById("channelSubtitle").textContent =
        `${d.display_name || d.kick_username} · ${t("subtitle")}`;
    }

    async function api(method, path, body) {
      const opts = { method, cache: "no-store", headers: {} };
      if (body) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    document.getElementById("langEn").onclick = () => { lang = "en"; localStorage.setItem("mod_lang", lang); applyI18n(); };
    document.getElementById("langPl").onclick = () => { lang = "pl"; localStorage.setItem("mod_lang", lang); applyI18n(); };

    document.getElementById("channelSelect").onchange = async (e) => {
      currentBid = Number(e.target.value);
      localStorage.setItem("mod_bid", String(currentBid));
      await refreshStatus();
    };

    document.getElementById("refreshBtn").onclick = () => refreshStatus().catch((e) => showResult(e.message, false));
    document.getElementById("testSpinBtn").onclick = async () => {
      try {
        const d = await api("POST", `/mod/${currentBid}/test-spin`, { n: 1 });
        showResult(d.message || "Spin sent");
        await refreshStatus();
      } catch (e) { showResult(e.message, false); }
    };
    document.getElementById("resetDelayBtn").onclick = async () => {
      try {
        const d = await api("POST", `/mod/${currentBid}/reset-delay`);
        showResult(d.message || "Delay reset");
        await refreshStatus();
      } catch (e) { showResult(e.message, false); }
    };
    document.getElementById("sendGiftsBtn").onclick = async () => {
      try {
        const gift_count = Number(document.getElementById("giftCount").value) || 1;
        const d = await api("POST", `/mod/${currentBid}/simulate-gift`, { gift_count });
        showResult(d.message || "Gifts sent");
        await refreshStatus();
      } catch (e) { showResult(e.message, false); }
    };
    document.getElementById("counterPlusBtn").onclick = async () => {
      try {
        const d = await api("POST", `/mod/${currentBid}/counter`, { delta: 1 });
        showResult(`Counter → ${d.count}/${d.goal}`);
        await refreshStatus();
      } catch (e) { showResult(e.message, false); }
    };

    applyI18n();
    loadChannels().catch((e) => {
      document.getElementById("emptyCard").querySelector(".empty").textContent = e.message || t("empty");
    });
    setInterval(() => { if (currentBid) refreshStatus().catch(() => {}); }, 5000);
  </script>
</body>
</html>
