name: Test & Deploy

on:
  push:
    branches: [main, dev]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run test:run

      # ── Semver bump (main branch only) ───────────────────────
      - name: Bump version (conventional commits)
        if: github.ref == 'refs/heads/main'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || echo "")

          if echo "$COMMITS" | grep -qi "BREAKING CHANGE"; then
            BUMP=major
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP=minor
          elif echo "$COMMITS" | grep -q "^fix"; then
            BUMP=patch
          else
            echo "No version-bumping commits found. Skipping bump."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Bumping $BUMP..."
          npm version $BUMP --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")

          git add package.json
          git commit -m "chore: bump version to v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push && git push --tags

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      # ── Deploy to Render (production) ────────────────────────
      - name: Deploy to Render (production)
        if: github.ref == 'refs/heads/main' && success()
        run: curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # ── Deploy to Render (dev) ───────────────────────────────
      - name: Deploy to Render (dev)
        if: github.ref == 'refs/heads/dev' && success()
        run: curl -sS -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
