<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Counter</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
    .counter-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      padding: 8px 16px;
      color: #f5f7fa;
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    .count {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: .5px;
      font-variant-numeric: tabular-nums;
      color: #e8edf7;
      text-shadow: 0 2px 4px rgba(0,0,0,.45);
      line-height: 1;
    }
    .count.pop { color:#ffffff; transform: scale(1.06); }
    .count { transition: color .25s, transform .25s; display:inline-block; }
  </style>
</head>
<body>
  <div class="counter-overlay">
    <div id="countText" class="count">0/0</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/counter\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : params.get("key") || "";
    })();
    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";

    const countTextEl = document.getElementById("countText");
    let lastCount = null;

    function render(count, goal) {
      const c = Math.max(0, Math.round(Number(count) || 0));
      const g = Math.max(0, Math.round(Number(goal) || 0));
      countTextEl.textContent = g > 0 ? `${c}/${g}` : `${c}`;
      if (lastCount !== null && c !== lastCount) {
        countTextEl.classList.add("pop");
        setTimeout(() => countTextEl.classList.remove("pop"), 400);
      }
      lastCount = c;
    }

    async function refresh() {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/counter`, { cache: "no-store" });
        const j = await r.json().catch(() => null);
        if (j?.ok) render(j.count, j.goal);
      } catch {}
    }

    refresh();
    setInterval(refresh, 30_000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail?.active) refresh(); });

    if (OVERLAY_KEY) {
      const WS_URL = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?key=" + encodeURIComponent(OVERLAY_KEY);
      let ws = null;
      function connectWS() {
        try { if (ws) ws.close(); } catch {}
        ws = new WebSocket(WS_URL);
        ws.onmessage = (evt) => {
          try {
            const data = JSON.parse(evt.data);
            if (data.type === "counter") render(data.count, data.goal);
          } catch {}
        };
        ws.onerror = () => { try { ws.close(); } catch {} };
        ws.onclose = () => setTimeout(connectWS, 10000);
      }
      connectWS();
    }
  </script>
</body>
</html>
