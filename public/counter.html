<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter — SpinDeck</title><style>
.stage{padding:8px!important}.counter{width:min(784px,98vw)!important;min-height:160px!important;padding:16px 22px 18px!important;border:2px solid color-mix(in srgb,var(--accent) 62%,rgba(255,255,255,.28))!important;background:var(--counter-surface,#121228f2)!important;box-shadow:0 16px 50px rgba(0,0,0,.58),0 0 28px color-mix(in srgb,var(--accent) 24%,transparent),inset 0 1px rgba(255,255,255,.12)!important}.counter .copy{width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}.counter .eyebrow{max-width:52%;margin:0;color:#fff;font-size:clamp(22px,3.4vw,30px);font-weight:950;letter-spacing:.035em;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 16px color-mix(in srgb,var(--accent) 55%,transparent)}.counter .numbers{flex:0 0 auto;gap:12px}.counter .count{font-size:clamp(78px,14vw,118px);line-height:.72;text-shadow:0 3px 8px rgba(0,0,0,.85),0 0 34px color-mix(in srgb,var(--accent) 70%,transparent)}.counter .goal{color:rgba(255,255,255,.78);font-size:clamp(32px,5.6vw,48px);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.8)}.counter .percent{position:absolute;right:0;bottom:-18px;color:#fff;font-size:17px;font-weight:950;text-shadow:0 2px 5px #000}.counter .track{height:17px;margin-top:22px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.22)}.counter .fill{box-shadow:0 0 8px rgba(255,255,255,.75),0 0 26px var(--accent)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",system-ui,sans-serif}:root{--accent:#7c3aed;--bg:#121228;--opacity:.9}.stage{width:100%;height:100%;display:grid;place-items:center;padding:18px}.counter{position:relative;width:min(760px,96vw);min-height:142px;padding:22px 26px 20px;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 34%,rgba(255,255,255,.12));border-radius:22px;background:color-mix(in srgb,var(--bg) calc(var(--opacity)*100%),transparent);box-shadow:0 20px 70px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.06);color:#f8f9ff}.counter::before{content:"";position:absolute;width:280px;height:180px;right:-70px;top:-95px;border-radius:50%;background:var(--accent);filter:blur(70px);opacity:.24}.top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:26px}.copy{min-width:0}.eyebrow{display:block;margin-bottom:9px;color:color-mix(in srgb,var(--accent) 72%,white);font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.numbers{display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}.count{font-size:clamp(48px,8vw,76px);font-weight:950;line-height:.8;letter-spacing:-.065em;text-shadow:0 0 30px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .25s,filter .25s}.goal{color:rgba(255,255,255,.45);font-size:clamp(20px,3.3vw,30px);font-weight:750}.percent{flex:0 0 auto;color:rgba(255,255,255,.62);font-size:13px;font-weight:800}.track{position:relative;height:9px;margin-top:22px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}.fill{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));box-shadow:0 0 20px var(--accent);transition:width .65s cubic-bezier(.22,.8,.22,1)}.counter.no-goal .goal,.counter.no-goal .percent,.counter.no-goal .track{display:none}.count.pop{transform:scale(1.08);filter:brightness(1.35)}.counter.complete{animation:complete 1.8s ease}.counter.complete .fill{animation:shine .8s ease 2}.counter.complete::after{content:"CEL OSIĄGNIĘTY";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 84%,transparent);color:white;font-size:clamp(18px,4vw,32px);font-weight:950;letter-spacing:.08em;animation:badge 1.8s both}@keyframes complete{50%{box-shadow:0 0 70px color-mix(in srgb,var(--accent) 65%,transparent)}}@keyframes badge{0%,100%{opacity:0;transform:scale(.94)}18%,76%{opacity:1;transform:scale(1)}}@keyframes shine{50%{filter:brightness(2)}}body.preview{background:radial-gradient(circle at 50% 50%,#1b2028,#090b0f 68%)}@media(max-width:520px){.stage{padding:10px}.counter{padding:18px;border-radius:17px}.top{gap:12px}.percent{display:none}.track{margin-top:17px}}
</style></head><body><main class="stage"><section class="counter" id="counter"><div class="top"><div class="copy"><span class="eyebrow" id="label">COUNTER</span><div class="numbers"><strong class="count" id="count">0</strong><span class="goal" id="goal"></span></div></div><span class="percent" id="percent"></span></div><div class="track"><i class="fill" id="fill"></i></div></section></main><script>
const params=new URLSearchParams(location.search);if(params.get("preview")==="1")document.body.classList.add("preview");const match=location.pathname.match(/^\/counter\/([A-Za-z0-9_-]+)/);const key=match?match[1]:params.get("key")||"";const base=key?`/overlay/${key}`:"";const card=document.querySelector("#counter"),countEl=document.querySelector("#count"),goalEl=document.querySelector("#goal"),labelEl=document.querySelector("#label"),percentEl=document.querySelector("#percent"),fill=document.querySelector("#fill");let lastCount=null,lastGoal=null,wasComplete=false;const color=(value,fallback)=>typeof value==="string"&&/^#[0-9a-f]{6}$/i.test(value)?value:fallback;
function surface(hex,opacity){const value=color(hex,"#121228").slice(1),alpha=Math.round(Math.max(.1,Math.min(1,opacity))*255).toString(16).padStart(2,"0");return `#${value}${alpha}`}
function theme(data){document.documentElement.style.setProperty("--accent",color(data.accent_color,"#7c3aed"));document.documentElement.style.setProperty("--bg",color(data.secondary_color,"#121228"));const opacity=Math.max(.1,Math.min(1,Number(data.opacity??data.wheel_opacity??.9)));document.documentElement.style.setProperty("--opacity",opacity)}function render(data={}){theme(data);const count=Math.max(0,Math.round(Number(data.count)||0)),goal=Math.max(0,Math.round(Number(data.goal)||0)),label=String(data.label||"COUNTER").trim();const progress=goal>0?Math.min(100,count/goal*100):0,complete=goal>0&&count>=goal;labelEl.textContent=label||"COUNTER";countEl.textContent=count;goalEl.textContent=goal>0?`/ ${goal}`:"";percentEl.textContent=goal>0?`${Math.round(progress)}%`:"";fill.style.width=`${progress}%`;card.classList.toggle("no-goal",goal<=0);if(lastCount!==null&&(count!==lastCount||goal!==lastGoal)){countEl.classList.remove("pop");void countEl.offsetWidth;countEl.classList.add("pop");setTimeout(()=>countEl.classList.remove("pop"),420)}if(complete&&!wasComplete){card.classList.remove("complete");void card.offsetWidth;card.classList.add("complete");setTimeout(()=>card.classList.remove("complete"),1900)}wasComplete=complete;lastCount=count;lastGoal=goal}
async function refresh(){if(!base)return;try{const response=await fetch(`${base}/counter`,{cache:"no-store"}),data=await response.json();if(data?.ok)render(data)}catch{}}window.addEventListener("message",event=>{if(event.origin===location.origin&&event.data?.type==="counter-preview")render(event.data)});refresh();setInterval(refresh,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});window.addEventListener("obsSourceActiveChanged",event=>{if(event.detail?.active)refresh()});if(key){const url=(location.protocol==="https:"?"wss":"ws")+`://${location.host}/ws?key=${encodeURIComponent(key)}`;let ws;function connect(){try{ws?.close()}catch{}ws=new WebSocket(url);ws.onmessage=event=>{try{const data=JSON.parse(event.data);if(data.type==="counter")render(data);if(data.type==="config")theme(data)}catch{}};ws.onerror=()=>ws.close();ws.onclose=()=>setTimeout(connect,10000)}connect()}
function theme(data){const accent=color(data.accent_color,"#7c3aed"),background=color(data.secondary_color,"#121228"),opacity=Math.max(.1,Math.min(1,Number(data.opacity??data.wheel_opacity??.9)));document.documentElement.style.setProperty("--accent",accent);document.documentElement.style.setProperty("--bg",background);document.documentElement.style.setProperty("--counter-surface",surface(background,opacity))}
</script></body></html>
