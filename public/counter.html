<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Counter</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
    :root { --accent: #7c3aed; }
    .counter-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      padding: 8px 16px;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      white-space: nowrap;
    }
    .label {
      font-size: 32px;
      font-weight: 700;
      color: #e8edf7;
      text-shadow: 0 2px 4px rgba(0,0,0,.45);
      line-height: 1;
      display: none;
    }
    .label.show { display: inline-block; }
    .count {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: .5px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-shadow: 0 2px 4px rgba(0,0,0,.45);
      line-height: 1;
      transition: filter .25s, transform .25s;
      display: inline-block;
    }
    .count.pop { filter: brightness(1.25); transform: scale(1.06); }
  </style>
</head>
<body>
  <div class="counter-overlay">
    <div id="labelText" class="label"></div>
    <div id="countText" class="count">0/0</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/counter\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : params.get("key") || "";
    })();
    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";

    const countTextEl = document.getElementById("countText");
    const labelTextEl = document.getElementById("labelText");
    let lastCount = null;
    let lastGoal = null;

    function applyAccent(hex) {
      if (typeof hex !== "string" || !/^#[0-9a-fA-F]{6}$/.test(hex.trim())) return;
      document.documentElement.style.setProperty("--accent", hex.trim());
    }

    function applyLabel(text) {
      if (typeof text !== "string") return;
      const t = text.trim();
      if (t) {
        labelTextEl.textContent = t;
        labelTextEl.classList.add("show");
      } else {
        labelTextEl.textContent = "";
        labelTextEl.classList.remove("show");
      }
    }

    function render(count, goal) {
      const c = Math.max(0, Math.round(Number(count) || 0));
      const g = Math.max(0, Math.round(Number(goal) || 0));
      countTextEl.textContent = g > 0 ? `${c}/${g}` : `${c}`;
      if (lastCount !== null && (c !== lastCount || g !== lastGoal)) {
        countTextEl.classList.add("pop");
        setTimeout(() => countTextEl.classList.remove("pop"), 400);
      }
      lastCount = c;
      lastGoal = g;
    }

    function applyPayload(j) {
      if (!j) return;
      if (typeof j.accent_color === "string") applyAccent(j.accent_color);
      if (typeof j.label === "string") applyLabel(j.label);
      if (j.count != null || j.goal != null) render(j.count, j.goal);
    }

    async function refresh() {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/counter`, { cache: "no-store" });
        const j = await r.json().catch(() => null);
        if (j?.ok) applyPayload(j);
      } catch {}
    }

    refresh();
    setInterval(refresh, 30_000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail?.active) refresh(); });

    if (OVERLAY_KEY) {
      const WS_URL = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?key=" + encodeURIComponent(OVERLAY_KEY);
      let ws = null;
      function connectWS() {
        try { if (ws) ws.close(); } catch {}
        ws = new WebSocket(WS_URL);
        ws.onmessage = (evt) => {
          try {
            const data = JSON.parse(evt.data);
            if (data.type === "counter") applyPayload(data);
            if (data.type === "config" && typeof data.accent_color === "string") applyAccent(data.accent_color);
          } catch {}
        };
        ws.onerror = () => { try { ws.close(); } catch {} };
        ws.onclose = () => setTimeout(connectWS, 10000);
      }
      connectWS();
    }
  </script>
</body>
</html>
