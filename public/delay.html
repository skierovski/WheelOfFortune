<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <title>Delay Timer</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
    :root { --secondary: #121228; --wheel-opacity: 0.9; }
    .delay-overlay { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); 
      opacity: 0; transition: opacity .4s ease; pointer-events: none; z-index: 15;
      padding: 20px 32px; border-radius: 16px; background: var(--delay-bg, rgba(17, 17, 17, 0.92)); 
      color: #fff; font-family: system-ui, sans-serif; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(8px); }
    .delay-overlay.show { opacity: 1; }
    .delay-overlay h3 { margin: 0 0 12px 0; font-size: 24px; font-weight: 700; color: var(--accent, #7c3aed); display:flex; align-items:center; justify-content:center; gap:8px; }
    .delay-overlay .time { font-size: 48px; font-weight: 800; margin: 8px 0; color: #fff; 
      font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    .delay-overlay .pending { font-size: 14px; color: #9ca3af; margin-top: 8px; }
    .delay-overlay .pending strong { color: var(--accent, #7c3aed); }
    .auth-warning {
      position: fixed;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
      display: none;
      color: #ef4444;
      font-family: system-ui, sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    .auth-warning.show { display: block; }
  </style>
</head>
<body>
  <div id="authWarning" class="auth-warning" aria-hidden="true">Re-login re auth</div>
  <div id="delayOverlay" class="delay-overlay" aria-hidden="true">
    <h3><i class="fi fi-rr-time-forward" aria-hidden="true"></i><span>Nastepne koło za:</span></h3>
    <div class="time" id="delayTime">0:00</div>
    <div class="pending" id="delayPending"></div>
  </div>

  <script>
    // ====== Delay overlay ======
    const delayOverlay = document.getElementById("delayOverlay");
    const delayTimeEl = document.getElementById("delayTime");
    const delayPendingEl = document.getElementById("delayPending");
    let currentDelaySeconds = 0;
    let pendingCount = 0;
    let delayUpdateInterval = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function updateDelayDisplay() {
      if (currentDelaySeconds > 0) {
        delayTimeEl.textContent = formatTime(currentDelaySeconds);
        if (pendingCount > 0) {
          delayPendingEl.innerHTML = `<strong>${pendingCount}</strong> spinow${pendingCount !== 1 ? 's' : ''} w kolejce`;
        } else {
          delayPendingEl.textContent = "";
        }
        delayOverlay.classList.add("show");
        delayOverlay.setAttribute("aria-hidden", "false");
      } else {
        delayOverlay.classList.remove("show");
        delayOverlay.setAttribute("aria-hidden", "true");
        if (delayUpdateInterval) {
          clearInterval(delayUpdateInterval);
          delayUpdateInterval = null;
        }
      }
    }

    function startDelayCountdown(seconds, pending = 0) {
      currentDelaySeconds = seconds;
      pendingCount = pending;
      updateDelayDisplay();
      
      if (delayUpdateInterval) clearInterval(delayUpdateInterval);
      delayUpdateInterval = setInterval(() => {
        if (currentDelaySeconds > 0) {
          currentDelaySeconds--;
          updateDelayDisplay();
        } else {
          clearInterval(delayUpdateInterval);
          delayUpdateInterval = null;
        }
      }, 1000);
    }

    // ====== Multi-tenant: extract overlay key from URL ======
    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/delay\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : new URLSearchParams(location.search).get("key") || "";
    })();
    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";
    const authWarningEl = document.getElementById("authWarning");
    let authOk = true;

    function applyAuthStatus(nextAuthOk, authMessage) {
      authOk = !!nextAuthOk;
      if (authWarningEl) {
        authWarningEl.textContent = authMessage || "Re-login re auth";
        authWarningEl.classList.toggle("show", !authOk);
        authWarningEl.setAttribute("aria-hidden", authOk ? "true" : "false");
      }
    }

    // ====== WebSocket connection ======
    const WS_URL = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?key=' + encodeURIComponent(OVERLAY_KEY);
    let ws = null;
    let reconnectDelay = 1000;
    let lastWsMessageTime = Date.now();

    function applyAccentColor(hex) {
      if (typeof hex === "string" && /^#[0-9a-fA-F]{6}$/.test(hex)) {
        document.documentElement.style.setProperty("--accent", hex);
      }
    }

    function applySecondaryAndOpacity(secondary, opacity) {
      if (typeof secondary === "string" && /^#[0-9a-fA-F]{6}$/.test(secondary)) {
        document.documentElement.style.setProperty("--secondary", secondary);
      }
      if (opacity != null) {
        const op = Math.max(0.1, Math.min(1.0, Number(opacity) || 0.9));
        document.documentElement.style.setProperty("--wheel-opacity", op);
      }
      // Rebuild the background from current CSS vars
      const sec = getComputedStyle(document.documentElement).getPropertyValue("--secondary").trim() || "#121228";
      const op = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--wheel-opacity")) || 0.9;
      const r = parseInt(sec.slice(1,3),16), g = parseInt(sec.slice(3,5),16), b = parseInt(sec.slice(5,7),16);
      document.documentElement.style.setProperty("--delay-bg", `rgba(${r},${g},${b},${Math.min(1, op + 0.02).toFixed(2)})`);
    }

    function handleServerMessage(data) {
      lastWsMessageTime = Date.now();
      if (Object.prototype.hasOwnProperty.call(data, "auth_ok")) {
        applyAuthStatus(data.auth_ok, data.auth_message);
      }
      if (data.type === "delay" && Number.isFinite(data.timeUntilNext)) {
        startDelayCountdown(data.timeUntilNext, data.pending || 0);
        return;
      }
      // Config update may carry color/opacity settings
      if (data.type === "config") {
        if (typeof data.accent_color === "string") applyAccentColor(data.accent_color);
        applySecondaryAndOpacity(data.secondary_color, data.wheel_opacity);
        return;
      }
    }

    async function fetchDelayStatus() {
      try {
        const r = await fetch(`${API_BASE}/spins/pending`, { cache: 'no-store' });
        const j = await r.json();
        if (Object.prototype.hasOwnProperty.call(j, "auth_ok")) {
          applyAuthStatus(j.auth_ok, j.auth_message);
        }
        const timeUntilNext = Math.max(0, Number(j?.timeUntilNext || 0));
        const pending = Math.max(0, Number(j?.count || 0));
        if (timeUntilNext > 0 || pending > 0) {
          startDelayCountdown(timeUntilNext, pending);
        } else {
          // No delay active, hide overlay
          currentDelaySeconds = 0;
          updateDelayDisplay();
        }
      } catch (e) {
        console.error("[DELAY] Failed to fetch status:", e);
      }
    }

    // Simple wake-up check for delay overlay
    async function checkDelayStatus() {
      try {
        const r = await fetch(`${API_BASE}/spins/pending`, { cache: 'no-store' });
        const j = await r.json();
        if (Object.prototype.hasOwnProperty.call(j, "auth_ok")) {
          applyAuthStatus(j.auth_ok, j.auth_message);
        }
        const timeUntilNext = Math.max(0, Number(j?.timeUntilNext || 0));
        const pending = Math.max(0, Number(j?.count || 0));
        
        if (timeUntilNext > 0 || pending > 0) {
          startDelayCountdown(timeUntilNext, pending);
        } else {
          currentDelaySeconds = 0;
          updateDelayDisplay();
        }
      } catch (e) {
        console.error("[DELAY] Failed to check:", e);
      }
    }

    function connectWS() {
      try { if (ws) ws.close(); } catch {}
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log("[DELAY WS] Connected (nice-to-have for instant updates)");
        reconnectDelay = 1000;
      };
      
      ws.onmessage = (evt) => {
        console.log("[DELAY WS] Got update:", evt.data);
        try { handleServerMessage(JSON.parse(evt.data)); } 
        catch (e) { console.error("[DELAY WS] Bad message", e); }
      };
      
      ws.onerror = () => { 
        console.log("[DELAY WS] Error (no problem, we have wake-up check)");
        try { ws.close(); } catch {} 
      };
      
      ws.onclose = () => {
        console.log("[DELAY WS] Disconnected (no problem)");
        setTimeout(connectWS, 10000); // Try again in 10 seconds
      };
    }

    // Fetch colors and opacity from config on startup
    (async () => {
      try {
        const r = await fetch(`${API_BASE}/config`, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j?.ok) {
            if (Object.prototype.hasOwnProperty.call(j, "auth_ok")) {
              applyAuthStatus(j.auth_ok, j.auth_message);
            }
            if (j.accent_color) applyAccentColor(j.accent_color);
            applySecondaryAndOpacity(j.secondary_color, j.wheel_opacity);
          }
        }
      } catch {}
    })();

    // Connect once
    connectWS();
    
    // Check every 5 seconds while visible (simple periodic update for countdown)
    setInterval(checkDelayStatus, 5000);

    // === SIMPLE WAKE-UP SYSTEM ===
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        console.log("[DELAY OBS] Overlay visible - checking for updates");
        checkDelayStatus(); // Simple: ask server once
      }
    });

    // OBS-specific event
    window.addEventListener("obsSourceActiveChanged", (event) => {
      if (event.detail?.active) {
        console.log("[DELAY OBS] Source activated - checking for updates");
        checkDelayStatus(); // Simple: ask server once
      }
    });
  </script>
</body>
</html>
