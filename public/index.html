<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <title>Wheel of Fortune</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100vw; height:100vh; }
    :root { --overlay-accent:#7c3aed; --overlay-bg:#121228; }
    .overlay { position: fixed; left:50%; top:50%; transform: translate(-50%, -46%) scale(0.88);
      opacity: 0; transition: opacity .6s ease, transform .75s cubic-bezier(.16,1,.3,1); pointer-events:none;
      width: calc(100vmin - 80px); height: calc(100vmin - 80px);
      display:flex; align-items:center; justify-content:center; z-index:10; }
    .overlay.show { opacity:1; transform: translate(-50%, -50%) scale(1); pointer-events:auto; }
    .overlay::before,.overlay::after{content:"";position:absolute;inset:11%;border-radius:50%;pointer-events:none;z-index:-1}
    .overlay::before{background:radial-gradient(circle,color-mix(in srgb,var(--overlay-accent) 22%,transparent),transparent 68%);filter:blur(34px);animation:halo 2.8s ease-in-out infinite}
    .overlay::after{inset:4%;border:1px solid color-mix(in srgb,var(--overlay-accent) 32%,transparent);opacity:.42;animation:orbit 12s linear infinite}
    canvas { width: calc(100vmin - 80px); height: calc(100vmin - 80px); display:block; }

    .editor { position:fixed; right:16px; top:16px; width:460px; max-height:92vh; overflow:auto; background:rgba(20,20,20,.95); color:#fff;
      font-family:system-ui,sans-serif; border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08);
      z-index:9999; display:none; }
    .editor.show { display:block; }
    .editor h2{ margin:0 0 10px 0; font-size:18px; display:flex; align-items:center; gap:8px; }
    .editor-title-icon{ display:inline-flex; align-items:center; }
    .row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
    .row input[type="text"]{ flex:1; padding:8px 10px; border-radius:8px; border:1px solid #333; background:#141414; color:#fff; }
    .row input[type="number"]{ width:84px; padding:8px 10px; border-radius:8px; border:1px solid #333; background:#141414; color:#fff; }
    .row button, .editor .btn { padding:8px 10px; border-radius:8px; border:1px solid #333; background:#1f1f1f; color:#fff; cursor:pointer; }
    .list{ display:grid; gap:6px; margin:10px 0; }
    .item{ display:grid; grid-template-columns:1fr 80px 98px auto auto auto auto; gap:6px; align-items:center; background:#151515; border:1px solid #2a2a2a; border-radius:8px; padding:8px; }
    .item span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .muted{ color:#9aa0a6; font-size:12px; }
    .pill{ display:inline-block; padding:4px 8px; border-radius:999px; background:#0f172a; border:1px solid #334155; color:#cbd5e1; font-size:12px; }

    .result-banner { position: absolute; left: 50%; top: 7%; transform: translate(-50%, -28px) rotate(-1deg) scale(.9); opacity: 0; padding: 16px 28px 18px;
      border-radius: 999px; border:1px solid color-mix(in srgb,var(--overlay-accent) 55%,white 15%); background: color-mix(in srgb,var(--overlay-bg) 82%,transparent); color: #fff; font-family: system-ui, sans-serif; font-weight: 900; letter-spacing: -.03em;
      line-height: 1; font-size: clamp(28px,5vmin,54px); box-shadow: 0 18px 60px rgba(0,0,0,.38),0 0 35px color-mix(in srgb,var(--overlay-accent) 30%,transparent); backdrop-filter: blur(12px);
      pointer-events: none; z-index: 20; transition: opacity .35s ease, transform .35s ease; }
    .result-banner::before{content:"WYGRANA";display:block;margin-bottom:7px;color:var(--overlay-accent);font-size:11px;letter-spacing:.22em;text-align:center}
    .result-banner.show { opacity: 1; transform: translate(-50%, 0) rotate(0) scale(1); }
    .bonus-badge{ display:inline-block;font-size:12px;margin-left:8px;padding:6px 9px;background:var(--overlay-accent);color:#09090b;border-radius:999px;vertical-align:middle;letter-spacing:.04em; }
    @keyframes halo{50%{transform:scale(1.08);opacity:.72}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.overlay,.result-banner{transition-duration:.01ms}.overlay::before,.overlay::after{animation:none}}
    .auth-warning {
      position: fixed;
      left: 50%;
      top: 6%;
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
      display: none;
      color: #ef4444;
      font-family: system-ui, sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    .auth-warning.show { display: block; }
  </style>
</head>
<body>
  <div id="authWarning" class="auth-warning" aria-hidden="true">Re-login re auth</div>
  <div id="resultBanner" class="result-banner" aria-hidden="true"></div>
  <div id="overlay" class="overlay">
    <canvas id="wheel" width="1000" height="1000"></canvas>
  </div>

  <!-- SFX/TTS -->
  <audio id="sfx" preload="auto"></audio>

  <!-- Admin/editor panel -->
  <div id="editor" class="editor" aria-hidden="true">
    <h2><span class="editor-title-icon"><i class="fi fi-rr-settings-sliders" aria-hidden="true"></i></span>Wheel editor <span class="pill">open via ?edit=1</span></h2>
    <div class="muted">Server-backed config. Viewers do not see this panel.</div>

    <div class="row" style="margin-top:6px;">
      <input id="newLabel" type="text" placeholder="New prize…">
      <input id="newWeight" type="number" min="0" step="0.1" value="10" title="Percent">
      <label class="muted" style="display:flex;align-items:center;gap:6px;">
        <input id="newBonus" type="checkbox"> Bonus spin
      </label>
      <button id="addBtn">Add</button>
    </div>
    <div class="muted" id="sumInfo"></div>
    <div class="list" id="list"></div>
    <div class="bar">
      <button class="btn" id="normalizeBtn">Normalize to 100%</button>
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="hideBtn">Close</button>
      <button class="btn" id="exportBtn">Export</button>
      <button class="btn" id="importBtn">Import</button>
    </div>
    <textarea id="importArea" placeholder='Paste JSON here (from "Export") and click "Import".'></textarea>

  </div>

  <script>
    // ====== Multi-tenant: extract overlay key from URL ======
    // URL pattern: /overlay/:key (served by Express, key is in the path)
    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/overlay\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : new URLSearchParams(location.search).get("key") || "";
    })();
    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";
    const PREVIEW_MODE = new URLSearchParams(location.search).get("preview") === "1";
    const authWarningEl = document.getElementById("authWarning");
    let authOk = true;

    function applyAuthStatus(nextAuthOk, authMessage) {
      authOk = !!nextAuthOk;
      if (authWarningEl) {
        authWarningEl.textContent = authMessage || "Re-login re auth";
        authWarningEl.classList.toggle("show", !authOk);
        authWarningEl.setAttribute("aria-hidden", authOk ? "true" : "false");
      }
    }

    // ====== Server config helpers ======
    async function fetchServerConfigFull() {
      try {
        const r = await fetch(`${API_BASE}/config`, { cache: "no-store" });
        if (!r.ok) return null;
        const j = await r.json();
        return j?.ok ? j : null;
      } catch { return null; }
    }

    // ====== Data / persistence (local cache only) ======
    const STORAGE_KEY_V2 = "wheel.prizes.v2";
    const DEFAULT_ITEMS = [
      { label:"VIP na 24h", weight:10, bonus:false }, { label:"Śpiewasz 30s", weight:10, bonus:false },
      { label:"Mem na IG", weight:10, bonus:false },  { label:"Reroll", weight:10, bonus:false },
      { label:"Wybór czatu", weight:10, bonus:false },{ label:"Shot (18+)", weight:10, bonus:false },
      { label:"Giveaway 1x", weight:10, bonus:false },{ label:"Wybór mapy", weight:10, bonus:false }
    ];

    function genId(){ return 'itm_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
    function sanitizeItem(it){
      const label = String(it?.label ?? "").trim();
      let weight = Number(it?.weight);
      if (!Number.isFinite(weight) || weight < 0) weight = 0;
      const id = String(it?.id || "");
      const bonus = !!it?.bonus;
      return { id: id || genId(), label, weight, bonus };
    }
    function loadItemsLocal(){
      try{
        const raw=localStorage.getItem(STORAGE_KEY_V2);
        if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr)&&arr.length) return arr.map(sanitizeItem); }
      }catch{}
      return DEFAULT_ITEMS.map(sanitizeItem);
    }
    function saveItemsLocal(items){ localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(items.map(sanitizeItem))); }

    let ITEMS = [];
    let TIERS = null; // Array of { name, min_gifts, items } or null
    let CONFIG_VERSION = 1;
    let ACCENT_COLOR = "#7c3aed"; // streamer-customizable accent color
    let SECONDARY_COLOR = "#121228"; // streamer-customizable secondary color
    let WHEEL_OPACITY = 0.9; // streamer-customizable wheel opacity

    // ====== Drawing etc. ======
    const FULL_ROUNDS_MIN = 8, FULL_ROUNDS_MAX = 12;
    const BAG_SIZE = 50;
    const NO_REPEAT_BACK_TO_BACK = true;
    const AT_LEAST_ONE_THRESHOLD = 1;

    let spinBag = [], bagPos = 0, spinBagVersion = 0, lastPickedId = null, lastIndex = -1;
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const dpr = Math.max(1, Math.floor(window.devicePixelRatio||1));
    (function setupCanvas(){ const cssW=1000, cssH=1000; canvas.width=cssW*dpr; canvas.height=cssH*dpr; canvas.style.width="100%"; canvas.style.height="100%"; ctx.setTransform(dpr,0,0,dpr,0,0); })();
    const W=1000,H=1000,CX=W/2,CY=H/2,R=Math.min(W,H)*0.36;
    let rotation = 0;
    let ACTIVE_SNAPSHOT = null;

    function modTau(x){ const TAU = 2*Math.PI; return ((x % TAU) + TAU) % TAU; }
    function getNormalizedWeightsFrom(items){
      const w = items.map(it=>Math.max(0, Number(it.weight)||0));
      const sum = w.reduce((a,b)=>a+b,0);
      if(sum<=0){ const eq=100/Math.max(1,items.length); return w.map(()=>eq); }
      return w.map(x=>x*(100/sum));
    }
    function buildSectors(items){
      const pct = getNormalizedWeightsFrom(items);
      const sectors = []; let acc=0;
      for(let i=0;i<items.length;i++){
        const startPct=acc, endPct=acc+pct[i]; acc=endPct;
        const start=(startPct/100)*2*Math.PI, end=(endPct/100)*2*Math.PI;
        sectors.push({ id:items[i].id, label:items[i].label, start, end, center:(start+end)/2, bonus: !!items[i].bonus });
      }
      return sectors;
    }
    function shuffleInPlace(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }
    function cloneItems(items){ return items.map(it=>({ id:it.id, label:it.label, weight:it.weight, bonus:!!it.bonus })); }

    function sectorUnderPointer(angle, sectors){
      const POINTER_ANGLE = -Math.PI/2;
      const rel = modTau(POINTER_ANGLE - modTau(angle));
      for (let i = 0; i < sectors.length; i++){
        const a = modTau(sectors[i].start), b = modTau(sectors[i].end);
        if (a <= b) { if (rel >= a && rel < b) return i; } else { if (rel >= a || rel < b) return i; }
      }
      return 0;
    }

    // ===== Helpers: text/arc =====
    function fitFontForArc(ctx, text, radius, arcAngle, maxPx = 42, minPx = 10) {
      const maxLen = radius * arcAngle * 0.9;
      let lo = minPx, hi = maxPx, best = minPx;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        ctx.font = `700 ${mid}px system-ui, sans-serif`;
        const w = ctx.measureText(text).width;
        if (w <= maxLen) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
      }
      ctx.font = `700 ${best}px system-ui, sans-serif`;
      return best;
    }
    function ellipsize(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      const ell = "…"; let s = text;
      while (s.length > 1 && ctx.measureText(s + ell).width > maxWidth) s = s.slice(0, -1);
      return s + ell;
    }

    // ===== Modern wheel (dark + accent color) =====
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return { r, g, b };
    }
    function rgbLighten(ac, amt) {
      return { r: Math.min(255, ac.r + amt), g: Math.min(255, ac.g + amt), b: Math.min(255, ac.b + amt) };
    }

    function mixRgb(a, b, amount) {
      return {
        r: Math.round(a.r + (b.r - a.r) * amount),
        g: Math.round(a.g + (b.g - a.g) * amount),
        b: Math.round(a.b + (b.b - a.b) * amount),
      };
    }

    function applyOverlayTheme() {
      document.documentElement.style.setProperty("--overlay-accent", ACCENT_COLOR);
      document.documentElement.style.setProperty("--overlay-bg", SECONDARY_COLOR);
    }

    function drawWheel(angle = 0) {
      const items = ACTIVE_SNAPSHOT || ITEMS;
      const ac = hexToRgb(ACCENT_COLOR);
      const sc = hexToRgb(SECONDARY_COLOR);
      const op = Math.max(0.1, Math.min(1.0, WHEEL_OPACITY));
      const acL = rgbLighten(ac, 80);
      ctx.clearRect(0, 0, W, H);
      const TAU = 2 * Math.PI;
      applyOverlayTheme();
      const rimW = 32;
      const rimOuter = R + rimW;
      const rimMid = R + rimW / 2;

      // ── Outer rim: dark glassmorphism band ──
      // Base dark fill with accent glow
      ctx.save();
      ctx.shadowColor = `rgba(${ac.r},${ac.g},${ac.b},0.3)`;
      ctx.shadowBlur = 42;
      ctx.beginPath(); ctx.arc(CX, CY, rimOuter, 0, TAU);
      ctx.arc(CX, CY, R, 0, TAU, true);
      ctx.fillStyle = `rgba(${sc.r},${sc.g},${sc.b},${Math.min(1, op + 0.05).toFixed(2)})`;
      ctx.fill();
      ctx.restore();

      // Glass refraction: subtle radial light on the rim band
      const rimGrad = ctx.createRadialGradient(CX, CY - rimOuter * 0.4, rimW, CX, CY, rimOuter);
      rimGrad.addColorStop(0, "rgba(255,255,255,0.08)");
      rimGrad.addColorStop(0.5, "rgba(255,255,255,0.02)");
      rimGrad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.beginPath(); ctx.arc(CX, CY, rimOuter, 0, TAU);
      ctx.arc(CX, CY, R, 0, TAU, true);
      ctx.fillStyle = rimGrad;
      ctx.fill();

      // Inner glow along the rim inner edge (frosted light leak)
      const innerGlow = ctx.createRadialGradient(CX, CY, R, CX, CY, R + rimW * 0.45);
      innerGlow.addColorStop(0, `rgba(${ac.r},${ac.g},${ac.b},0.08)`);
      innerGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.beginPath(); ctx.arc(CX, CY, rimOuter, 0, TAU);
      ctx.arc(CX, CY, R, 0, TAU, true);
      ctx.fillStyle = innerGlow;
      ctx.fill();

      // Rim outer edge (accent stroke)
      ctx.beginPath(); ctx.arc(CX, CY, rimOuter, 0, TAU);
      ctx.strokeStyle = `rgba(${ac.r},${ac.g},${ac.b},0.5)`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Rim inner edge (subtle light)
      ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU);
      ctx.strokeStyle = `rgba(255,255,255,0.08)`;
      ctx.lineWidth = 1;
      ctx.stroke();

      if (!items || items.length === 0) {
        ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU);
        ctx.fillStyle = `rgba(${sc.r},${sc.g},${sc.b},${op.toFixed(2)})`; ctx.fill();
        ctx.beginPath(); ctx.arc(CX, CY, 8, 0, TAU);
        ctx.fillStyle = ACCENT_COLOR; ctx.fill();
        drawPointer(ac, rimOuter);
        return;
      }

      const sectors = buildSectors(items);

      // ── Glassmorphism segments ──
      for (let i = 0; i < sectors.length; i++) {
        const s = sectors[i];
        const start = angle + s.start;
        const end = angle + s.end;
        const arcAngle = end - start;

        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, start, end);
        ctx.closePath();

        // Alternating broadcast palette derived only from the configured
        // accent and background. This stays generic while remaining lively.
        const tone = i % 2 === 0 ? mixRgb(sc, ac, .18) : mixRgb(sc, ac, .62);
        ctx.fillStyle = `rgba(${tone.r},${tone.g},${tone.b},${op.toFixed(2)})`;
        ctx.fill();

        // Glass highlight: bright edge along the outer arc of each segment
        const highlightR = R * 0.92;
        const midA = start + arcAngle / 2;
        const grad = ctx.createRadialGradient(CX, CY, highlightR, CX, CY, R);
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(1, "rgba(255,255,255,0.07)");
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, start, end);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // Inner light refraction (subtle top-light shine on each segment)
        const shineX = CX + Math.cos(midA) * R * 0.35;
        const shineY = CY + Math.sin(midA) * R * 0.35;
        const shine = ctx.createRadialGradient(shineX, shineY, 0, shineX, shineY, R * 0.4);
        shine.addColorStop(0, "rgba(255,255,255,0.06)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, start, end);
        ctx.closePath();
        ctx.fillStyle = shine;
        ctx.fill();

        // ── Text ──
        const mid = start + arcAngle / 2;
        const rText = R * 0.66;
        const rawLabel = String(s.label || "");
        const fontPx = fitFontForArc(ctx, rawLabel, rText, arcAngle, 36, 10);
        ctx.font = `800 ${fontPx}px system-ui, sans-serif`;
        const maxLen = rText * arcAngle * 0.85;
        const label = ellipsize(ctx, rawLabel, maxLen);

        const tx = CX + Math.cos(mid) * rText;
        const ty = CY + Math.sin(mid) * rText;
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(mid + Math.PI / 2);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = Math.max(3, Math.round(fontPx * 0.12));
        ctx.strokeStyle = "rgba(0,0,0,0.72)";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;
        ctx.strokeText(label, 0, 0);
        ctx.shadowBlur = 0;
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }

      // ── Segment divider lines (glass edge effect) ──
      for (let i = 0; i < sectors.length; i++) {
        const a = angle + sectors[i].start;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // ── Bright accent pegs on the dark rim ──
      for (let i = 0; i < sectors.length; i++) {
        const a = angle + sectors[i].start;
        const px = CX + Math.cos(a) * rimMid;
        const py = CY + Math.sin(a) * rimMid;

        ctx.save();
        ctx.shadowColor = `rgba(${acL.r},${acL.g},${acL.b},0.7)`;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, TAU);
        ctx.fillStyle = ACCENT_COLOR;
        ctx.fill();
        ctx.restore();

        // Bright highlight center
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, TAU);
        ctx.fillStyle = `rgba(${acL.r},${acL.g},${acL.b},0.9)`;
        ctx.fill();
      }

      // ── Center hub: small frosted circle ──
      const hubR = 32;
      ctx.save();
      ctx.shadowColor = `rgba(${ac.r},${ac.g},${ac.b},0.35)`;
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(CX, CY, hubR, 0, TAU);
      ctx.fillStyle = `rgba(${sc.r},${sc.g},${sc.b},${Math.min(1, op + 0.05).toFixed(2)})`;
      ctx.fill();
      ctx.restore();

      // Hub glass highlight
      ctx.beginPath(); ctx.arc(CX, CY, hubR, 0, TAU);
      ctx.strokeStyle = `rgba(255,255,255,0.12)`;
      ctx.lineWidth = 1;
      ctx.stroke();

      // Accent dot
      ctx.beginPath(); ctx.arc(CX, CY, 9, 0, TAU);
      ctx.fillStyle = ACCENT_COLOR; ctx.fill();

      // ── Pointer ──
      drawPointer(ac, rimOuter);
    }

    function drawPointer(ac, rimOuter) {
      // The narrow tip must point into the wheel. Keeping the wide base outside
      // makes the selected sector unambiguous even on narrow slices.
      const ptrTip = CY - R + 14;
      const ptrBase = CY - rimOuter - 8;
      ctx.save();
      ctx.shadowColor = `rgba(${ac.r},${ac.g},${ac.b},0.5)`;
      ctx.shadowBlur = 12;
      ctx.fillStyle = ACCENT_COLOR;
      ctx.beginPath();
      ctx.moveTo(CX, ptrTip);
      ctx.lineTo(CX - 16, ptrBase);
      ctx.lineTo(CX + 16, ptrBase);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function getNormalizedWeights(){ return getNormalizedWeightsFrom(ITEMS); }

    function buildSpinBag(){
      const L = ITEMS.length;
      if (L === 0) {
        spinBag = [];
        bagPos = 0;
        spinBagVersion = CONFIG_VERSION;
        return;
      }

      const n = L;
      const norm = getNormalizedWeights();
      const desired = norm.map(p=>p*BAG_SIZE/100);

      let counts=new Array(n).fill(0), assigned=0, residuals=new Array(n).fill(0);
      for (let i=0;i<n;i++){ counts[i]=Math.floor(desired[i]); assigned+=counts[i]; residuals[i]=desired[i]-Math.floor(desired[i]); }
      for (let i=0;i<n;i++){ if (norm[i]>=AT_LEAST_ONE_THRESHOLD && counts[i]===0){ counts[i]++; assigned++; } }

      const byResidualDesc=[...Array(n).keys()].sort((a,b)=>residuals[b]-residuals[a]);
      const byResidualAsc=[...Array(n).keys()].sort((a,b)=>residuals[a]-residuals[b]);
      const byPctAsc=[...Array(n).keys()].sort((a,b)=>norm[a]-norm[b]);

      while(assigned<BAG_SIZE){ for(let k=0;k<n && assigned<BAG_SIZE;k++){ counts[byResidualDesc[k]]++; assigned++; } }
      if(assigned>BAG_SIZE){
        let iA=0,iB=0;
        while(assigned>BAG_SIZE && (iA<n || iB<n)){
          const i = (iA<n) ? byResidualAsc[iA++] : byPctAsc[iB++];
          if (counts[i]>0 && !(norm[i]>=AT_LEAST_ONE_THRESHOLD && counts[i]===1)){ counts[i]--; assigned--; }
        }
      }

      const bag=[];
      for (let i=0;i<n;i++){
        const id = ITEMS[i].id ?? (ITEMS[i].id = genId());
        for(let c=0;c<counts[i];c++) bag.push(id);
      }
      shuffleInPlace(bag);
      spinBag=bag; bagPos=0; spinBagVersion=CONFIG_VERSION;
    }

    function nextFromBag(){
      if(!spinBag || bagPos>=spinBag.length || spinBagVersion!==CONFIG_VERSION) buildSpinBag();
      if (spinBag.length === 0) return null;
      let pickedId = spinBag[bagPos++];
      if (NO_REPEAT_BACK_TO_BACK && lastPickedId===pickedId && spinBag.length>1){
        if (bagPos<spinBag.length && spinBag[bagPos]!==lastPickedId){ const alt=spinBag[bagPos]; spinBag[bagPos]=pickedId; pickedId=alt; }
        else { for(let i=bagPos;i<spinBag.length;i++){ if (spinBag[i]!==lastPickedId){ const alt=spinBag[i]; spinBag[i]=pickedId; pickedId=alt; break; } } }
      }
      lastPickedId=pickedId;
      return pickedId;
    }

    function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }
    function easeOutSeptic(t){ return 1 - Math.pow(1 - t, 7); }

    // ====== Tick sound (Web Audio) ======
    // OBS Browser Sources allow autoplay — this works with zero interaction in OBS.
    // Regular Chrome blocks AudioContext until user gesture; the code self-recovers.
    let audioCtx = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
      }
      // Always attempt resume — harmless if already running, required if suspended
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    // Eagerly create on load — in OBS this immediately transitions to "running"
    ensureAudioCtx();

    // Also try to unlock on any interaction (covers Chrome browser testing)
    function unlockAudio() {
      const ctx = ensureAudioCtx();
      if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    document.addEventListener("click", unlockAudio, { once: true });
    document.addEventListener("touchstart", unlockAudio, { once: true });
    document.addEventListener("keydown", unlockAudio, { once: true });
    window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail?.active) unlockAudio(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) unlockAudio(); });

    // Short percussive "click" — like a peg hitting a flapper
    let lastTickTime = 0;
    const TICK_COOLDOWN_MS = 40; // max ~25 ticks/sec to prevent machine-gun bursts

    function playTick() {
      try {
        const now = performance.now();
        if (now - lastTickTime < TICK_COOLDOWN_MS) return; // throttle fast spins
        lastTickTime = now;

        const ctx = ensureAudioCtx();
        if (!ctx || ctx.state !== "running") return;
        const t = ctx.currentTime;

        // Short burst of shaped noise for a natural "click"
        const bufLen = Math.round(ctx.sampleRate * 0.012); // 12ms
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
          // Noise with a sharp exponential decay
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.15));
        }

        const src = ctx.createBufferSource();
        src.buffer = buf;

        // Bandpass filter to shape the click (removes muddiness)
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 3200;
        filter.Q.value = 1.2;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.015);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        src.start(t);
        src.stop(t + 0.015);
      } catch {}
    }
    let lastTickSegment = -1;

    async function spinToId(pickedId){
      if (!pickedId) return { index:-1, snap:null, label:"", bonus:false };
      ACTIVE_SNAPSHOT = cloneItems(ITEMS);
      const SNAP = ACTIVE_SNAPSHOT; const sectors = buildSectors(SNAP);
      let pickedIdx = sectors.findIndex(s => s.id === pickedId);
      if (pickedIdx === -1) pickedIdx = 0;
      const picked = sectors[pickedIdx];

      const POINTER_ANGLE = -Math.PI/2; const TAU = 2*Math.PI;
      const startAngle = modTau(rotation); let centeredTarget = POINTER_ANGLE - picked.center;

      while (centeredTarget <= startAngle) centeredTarget += TAU;
      const roundsInt = Math.floor(FULL_ROUNDS_MIN + Math.random()*(FULL_ROUNDS_MAX - FULL_ROUNDS_MIN + 1));
      centeredTarget += Math.max(FULL_ROUNDS_MIN, roundsInt) * TAU;

      // Finish the fast phase safely inside the winning sector, then visibly
      // settle its exact centre under the pointer. The offset never approaches
      // a divider, including on very small weighted sectors.
      const halfArc = Math.max(0, (picked.end - picked.start) / 2);
      const settleOffset = Math.min(halfArc * 0.28, 0.14) * (Math.random() < 0.5 ? -1 : 1);
      const approachTarget = centeredTarget + settleOffset;

      const spinDuration = 8500;
      const settleDuration = 650;
      const t0 = performance.now();

      lastTickSegment = -1;
      return new Promise(resolve=>{
        function frame(t){
          const elapsed = t - t0;
          const inSettle = elapsed > spinDuration;
          if (!inSettle) {
            const p = Math.min(1, elapsed / spinDuration);
            rotation = startAngle + (approachTarget - startAngle) * easeOutSeptic(p);
          } else {
            const settleP = Math.min(1, (elapsed - spinDuration) / settleDuration);
            rotation = approachTarget + (centeredTarget - approachTarget) * easeOutQuint(settleP);
          }
          drawWheel(rotation);

          // Tick sound on segment boundary cross
          const curSeg = sectorUnderPointer(rotation, sectors);
          if (curSeg !== lastTickSegment && lastTickSegment !== -1) playTick();
          lastTickSegment = curSeg;

          if (elapsed < spinDuration + settleDuration) requestAnimationFrame(frame);
          else {
            rotation = centeredTarget;
            drawWheel(rotation);
            const winIdx = sectorUnderPointer(rotation, sectors);
            const winSec = sectors[winIdx];
            const bonus = !!winSec.bonus;
            lastIndex = pickedIdx;
            setTimeout(()=>{ ACTIVE_SNAPSHOT = null; }, 0);
            resolve({ index: winIdx, snap: SNAP, label: winSec.label, bonus });
          }
        }
        requestAnimationFrame(frame);
      });
    }

    const overlay = document.getElementById("overlay");
    const queue = []; let spinning=false; let hideTimer=null;
    function showOverlay(){ clearTimeout(hideTimer); overlay.classList.add("show"); }
    function hideOverlay(afterMs = 1600) {
      if (PREVIEW_MODE) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(()=>{ overlay.classList.remove("show"); hideResult(); }, afterMs);
    }

    const resultBanner = document.getElementById("resultBanner");
    let resultTimer = null;
    function showResult(label, ms = 1800, isBonus = false) {
      if (!resultBanner) return;
      clearTimeout(resultTimer);
      resultBanner.innerHTML = isBonus
        ? `${label} <span class="bonus-badge">+ bonus spin</span>`
        : label || "";
      resultBanner.classList.add("show");
      resultBanner.setAttribute("aria-hidden", "false");
      resultTimer = setTimeout(hideResult, ms);
    }
    function hideResult() {
      if (!resultBanner) return;
      resultBanner.classList.remove("show");
      resultBanner.setAttribute("aria-hidden", "true");
    }

    function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

    // ====== SFX / TTS ======
    const urlp = new URLSearchParams(location.search);
    const SND_URL = urlp.get("sound") || "";   // ?sound=/sounds/ding.mp3
    const USE_TTS = urlp.get("tts") === "1";   // ?tts=1
    const sfx = document.getElementById("sfx");
    if (SND_URL) sfx.src = SND_URL;

    function playSound(){ try{ if (SND_URL) { sfx.currentTime = 0; sfx.play().catch(()=>{}); } }catch{} }
    function speak(text){
      if (!USE_TTS || !("speechSynthesis" in window)) return;
      try {
        const u = new SpeechSynthesisUtterance(String(text||""));
        u.rate=1; u.pitch=1; u.lang="pl-PL";
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch {}
    }

    async function runQueue(){
      if (spinning) return;
      spinning=true;
      if (queue.length){ showOverlay(); await wait(400); }
      while (queue.length) {
        const entry = queue[0];
        const tierName = (typeof entry === "object" && entry !== null) ? entry.tier : null;
        const serverPickedId = (typeof entry === "object" && entry !== null) ? entry.pickedId : null;
        const executionTicket = (typeof entry === "object" && entry !== null) ? entry.ticket : null;

        // If a tier is specified, temporarily swap items for this spin
        let savedItems = null;
        let savedBag = null;
        let savedBagPos = null;
        if (tierName) {
          const tierItems = getItemsForTier(tierName);
          if (tierItems && tierItems.length > 0) {
            savedItems = ITEMS;
            savedBag = spinBag;
            savedBagPos = bagPos;
            ITEMS = tierItems;
            buildSpinBag();
            if (!ACTIVE_SNAPSHOT) drawWheel(rotation);
          }
        }

        // Production spins carry a server-selected prize. The local bag remains
        // only as a compatibility fallback for older servers and preview mode.
        const pickedId = serverPickedId || nextFromBag();
        const result = await spinToId(pickedId);
        if (result.label) {
          showResult(result.label, 1800, result.bonus);
          playSound();
          speak(result.label);

          fetch(`${API_BASE}/chat/announce`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Overlay-Ticket': executionTicket || '' },
            body: JSON.stringify({})
          }).catch(()=>{});
        }

        // Restore original items after tier spin
        if (savedItems) {
          ITEMS = savedItems;
          spinBag = savedBag;
          bagPos = savedBagPos;
          if (!ACTIVE_SNAPSHOT) drawWheel(rotation);
        }

        queue.shift();
        await wait(2000);
        
        // Notify server after EACH spin completes (not just at the end)
        // This ensures 5-minute delay between each spin, even if multiple are queued
        fetch(`${API_BASE}/spins/complete`, {
          method: 'POST',
          headers: { 'X-Overlay-Ticket': executionTicket || '' }
        }).catch(()=>{});
      }
      spinning=false;
      hideOverlay(1000);
    }

    // ====== WebSocket & watchdog ======
    const WS_URL = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?key=' + encodeURIComponent(OVERLAY_KEY);

    let ws = null;
    let reconnectDelay = 1000;
    let lastSignalAt = Date.now();
    const staleKickMs = 60_000;
    const hardReloadEveryMs = 30 * 60_000;

    function getItemsForTier(tierName) {
      if (!tierName || !Array.isArray(TIERS) || TIERS.length === 0) return null;
      const t = TIERS.find(t => t.name === tierName);
      return t ? t.items.map(sanitizeItem) : null;
    }

    function handleServerMessage(data) {
      if (Object.prototype.hasOwnProperty.call(data, "auth_ok")) {
        applyAuthStatus(data.auth_ok, data.auth_message);
      }
      if (data.type === "config") {
        if (Array.isArray(data.items)) {
          ITEMS = data.items.map(sanitizeItem);
        }
        if (Array.isArray(data.tiers)) {
          TIERS = data.tiers;
        }
        if (typeof data.accent_color === "string") ACCENT_COLOR = data.accent_color;
        if (typeof data.secondary_color === "string") SECONDARY_COLOR = data.secondary_color;
        if (data.wheel_opacity != null) WHEEL_OPACITY = Math.max(0.1, Math.min(1.0, Number(data.wheel_opacity) || 0.9));
        CONFIG_VERSION++; renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag();
        return;
      }
      if (data.action === "spin" && Number.isFinite(data.times)) {
        const tierName = data.tier || null;
        queue.push({ times: 1, tier: tierName, pickedId: data.pickedId || null, ticket: data.ticket || null });
        showOverlay(); runQueue(); return;
      }
    }

    // Simple wake-up check - only when overlay becomes visible
    async function checkForPendingSpins() {
      try {
        const r = await fetch(`${API_BASE}/spins/pending`, { cache: 'no-store' });
        const j = await r.json();
        if (Object.prototype.hasOwnProperty.call(j, "auth_ok")) {
          applyAuthStatus(j.auth_ok, j.auth_message);
        }
        const pending = Math.max(0, Number(j?.count || 0));
        const timeUntilNext = Math.max(0, Number(j?.timeUntilNext || 0));
        if (pending > 0 && timeUntilNext === 0 && queue.length === 0 && !spinning) {
          queue.push(1);
          showOverlay();
          runQueue();
        }
      } catch {}
    }

    function connectWS() {
      try { if (ws) ws.close(); } catch {}
      ws = new WebSocket(WS_URL);

      ws.onopen = () => { reconnectDelay = 1000; };
      
      ws.onmessage = (evt) => {
        try { handleServerMessage(JSON.parse(evt.data)); } catch {}
      };
      
      ws.onerror = () => { try { ws.close(); } catch {} };
      
      ws.onclose = () => { setTimeout(connectWS, 10000); };
    }
    
    // Connect once on page load
    connectWS();

    canvas.addEventListener("click", () => { queue.push(1); showOverlay(); runQueue(); });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForPendingSpins(); });
    window.addEventListener("obsSourceActiveChanged", (event) => { if (event.detail?.active) checkForPendingSpins(); });
    setInterval(checkForPendingSpins, 30000);

    // ====== Editor (client-side helper) ======
    const editor=document.getElementById("editor");
    const listEl=document.getElementById("list");
    const newLabel=document.getElementById("newLabel");
    const newWeight=document.getElementById("newWeight");
    const newBonus=document.getElementById("newBonus");
    const addBtn=document.getElementById("addBtn");
    const resetBtn=document.getElementById("resetBtn");
    const hideBtn=document.getElementById("hideBtn");
    const normalizeBtn=document.getElementById("normalizeBtn");
    const exportBtn=document.getElementById("exportBtn");
    const importBtn=document.getElementById("importBtn");
    const importArea=document.getElementById("importArea");
    const sumInfo=document.getElementById("sumInfo");

    function totalWeight(){ return ITEMS.reduce((s,x)=> s + Math.max(0, Number(x.weight)||0), 0); }
    function sumWeights(){ return totalWeight(); }

    function renderList(){
      listEl.innerHTML="";
      sumInfo.textContent=`Sum of weights: ${sumWeights().toFixed(2)}%`;
      ITEMS.forEach((it,i)=>{
        const row=document.createElement("div"); row.className="item";

        const name=document.createElement("span"); name.textContent=it.label;

        const weight=document.createElement("input"); weight.type="number"; weight.min="0"; weight.step="0.1";
        weight.value=Number(it.weight).toFixed(2); weight.title="Percent (weight)";
        weight.onchange=()=>{ let v=Number(weight.value); if(!Number.isFinite(v)||v<0) v=0;
          ITEMS[i].weight=v; CONFIG_VERSION++; renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); };

        const bonusWrap = document.createElement("label");
        bonusWrap.style.display="inline-flex"; bonusWrap.style.alignItems="center"; bonusWrap.style.gap="6px";
        bonusWrap.style.userSelect="none"; bonusWrap.title="Bonus: dodatkowe zakręcenie po trafieniu";
        const bonusChk = document.createElement("input"); bonusChk.type="checkbox"; bonusChk.checked=!!it.bonus;
        bonusChk.onchange=()=>{ ITEMS[i].bonus = !!bonusChk.checked; CONFIG_VERSION++; };
        const bonusTxt = document.createElement("span"); bonusTxt.textContent="Bonus spin";
        bonusWrap.appendChild(bonusChk); bonusWrap.appendChild(bonusTxt);

        const up=document.createElement("button"); up.innerHTML='<i class="fi fi-rr-arrow-small-up" aria-hidden="true"></i>'; up.title = "Move up";
        up.onclick=()=>{ if(i>0){ [ITEMS[i-1],ITEMS[i]]=[ITEMS[i],ITEMS[i-1]]; CONFIG_VERSION++; renderList();
          if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); } };

        const down=document.createElement("button"); down.innerHTML='<i class="fi fi-rr-arrow-small-down" aria-hidden="true"></i>'; down.title = "Move down";
        down.onclick=()=>{ if(i<ITEMS.length-1){ [ITEMS[i+1],ITEMS[i]]=[ITEMS[i],ITEMS[i+1]]; CONFIG_VERSION++; renderList();
          if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); } };

        const edit=document.createElement("button"); edit.innerHTML='<i class="fi fi-rr-edit" aria-hidden="true"></i>'; edit.title = "Rename prize";
        edit.onclick=()=>{ const v=prompt("Rename prize:", ITEMS[i].label);
          if(v!==null){ const s=v.trim(); if(s){ ITEMS[i].label=s; CONFIG_VERSION++; renderList();
            if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); } } };

        const del=document.createElement("button"); del.innerHTML='<i class="fi fi-rr-trash" aria-hidden="true"></i>'; del.title = "Delete prize";
        del.onclick=()=>{
          if (ITEMS.length <= 1) { alert("At least one prize must remain."); return; }
          ITEMS.splice(i,1); CONFIG_VERSION++; renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag();
        };

        row.appendChild(name);
        row.appendChild(weight);
        row.appendChild(bonusWrap);
        row.appendChild(up); row.appendChild(down); row.appendChild(edit); row.appendChild(del);
        listEl.appendChild(row);
      });
    }

    addBtn.onclick=()=>{ const label=(newLabel.value||"").trim(); let w=Number(newWeight.value);
      if(!label) return; if(!Number.isFinite(w)||w<0) w=0;
      ITEMS.push({id:genId(), label, weight:w, bonus: !!newBonus.checked}); CONFIG_VERSION++; newLabel.value=""; newBonus.checked=false;
      renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); };

    resetBtn.onclick=()=>{ if(confirm("Restore defaults?")){
      ITEMS=DEFAULT_ITEMS.map(sanitizeItem); CONFIG_VERSION++; renderList();
      if(!ACTIVE_SNAPSHOT) drawWheel(rotation); saveItemsLocal(ITEMS); buildSpinBag(); } };

    hideBtn.onclick=()=> editor.classList.toggle("show", false);

    normalizeBtn.onclick=()=>{ const sum=sumWeights();
      if(sum<=0){ const eq=ITEMS.length?(100/ITEMS.length):0; ITEMS=ITEMS.map(it=>({...it, weight:eq})); }
      else { ITEMS=ITEMS.map(it=>({...it, weight:(it.weight/sum)*100 })); }
      CONFIG_VERSION++; renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag(); };

    exportBtn.onclick=()=>{ importArea.value=JSON.stringify(ITEMS,null,2); importArea.focus(); importArea.select(); };
    importBtn.onclick=()=>{ try{
        const arr=JSON.parse(importArea.value);
        if(Array.isArray(arr)){
          ITEMS=arr.map(sanitizeItem);
        } else {
          alert("Invalid JSON format."); return;
        }
        CONFIG_VERSION++; renderList(); if(!ACTIVE_SNAPSHOT) drawWheel(rotation); buildSpinBag();
      }catch{ alert("Invalid JSON."); } };

    function toggleEditor(show){ editor.classList.toggle("show", !!show); editor.setAttribute("aria-hidden", show?"false":"true"); }

    (async function boot(){
      const p = new URLSearchParams(location.search);
      if (p.get("edit") === "1") toggleEditor(true);

      const cfg = await fetchServerConfigFull();
      if (cfg) {
        if (Object.prototype.hasOwnProperty.call(cfg, "auth_ok")) {
          applyAuthStatus(cfg.auth_ok, cfg.auth_message);
        }
        if (Array.isArray(cfg.items)) ITEMS = cfg.items.map(sanitizeItem); else ITEMS = loadItemsLocal();
        if (Array.isArray(cfg.tiers)) TIERS = cfg.tiers;
        if (typeof cfg.accent_color === "string") ACCENT_COLOR = cfg.accent_color;
        if (typeof cfg.secondary_color === "string") SECONDARY_COLOR = cfg.secondary_color;
        if (cfg.wheel_opacity != null) WHEEL_OPACITY = Math.max(0.1, Math.min(1.0, Number(cfg.wheel_opacity) || 0.9));
      } else {
        ITEMS = loadItemsLocal();
      }

      CONFIG_VERSION++; renderList(); buildSpinBag(); drawWheel(0);
      if (PREVIEW_MODE) showOverlay();
    })();
  </script>
</body>
