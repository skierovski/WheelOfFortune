<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Sub Counter</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
    :root { --text:#f5f7fa; --muted:#d7dde7; }
    .subs-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      min-width: 240px;
      max-width: 420px;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .row {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      line-height:1;
    }
    .icon {
      width:26px; height:26px; border-radius:6px; object-fit:cover; flex:0 0 auto;
      display:none;
    }
    .icon.show { display:block; }
    .count {
      font-size:38px;
      font-weight:800;
      letter-spacing: .2px;
      font-variant-numeric: tabular-nums;
      color:#e8edf7;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
    }
    .count.pop { color:#ffffff; }
    .label {
      margin-top: 2px;
      margin-left: 0;
      font-size: 26px;
      line-height: 1;
      font-weight: 700;
      color: var(--muted);
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align:center;
    }
    .label.no-icon { margin-left: 0; text-align:center; }
  </style>
</head>
<body>
  <div id="subsOverlay" class="subs-overlay">
    <div class="row">
      <img id="counterIcon" class="icon" alt="">
      <div id="countText" class="count">0</div>
    </div>
    <div id="subLabel" class="label">Na co</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/subs\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : params.get("key") || "";
    })();
    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";

    const countTextEl = document.getElementById("countText");
    const labelEl = document.getElementById("subLabel");
    const iconEl = document.getElementById("counterIcon");

    let target = 0;
    let iconUrl = null;
    let lastValue = null;

    function applyConfig(cfg) {
      if (!cfg) return;
      if (Number.isFinite(cfg.sub_goal)) target = Math.max(0, Number(cfg.sub_goal) || 0);
      if (typeof cfg.sub_counter_label === "string" && cfg.sub_counter_label.trim()) {
        labelEl.textContent = cfg.sub_counter_label.trim();
      }
      if (typeof cfg.sub_counter_image_url === "string" && cfg.sub_counter_image_url.trim()) {
        iconUrl = cfg.sub_counter_image_url.trim();
      } else {
        iconUrl = null;
      }
      if (iconUrl) {
        iconEl.src = iconUrl;
        iconEl.classList.add("show");
        labelEl.classList.remove("no-icon");
      } else {
        iconEl.removeAttribute("src");
        iconEl.classList.remove("show");
        labelEl.classList.add("no-icon");
      }
    }

    function renderCount(estimated) {
      if (!Number.isFinite(estimated)) return;
      const n = Math.max(0, Math.round(Number(estimated) || 0));
      countTextEl.textContent = target > 0 ? `${n}/${target}` : `${n}`;
      if (lastValue !== null && n !== lastValue) {
        countTextEl.classList.add("pop");
        setTimeout(() => countTextEl.classList.remove("pop"), 500);
      }
      lastValue = n;
    }

    function applySubsPayload(payload) {
      if (!payload) return;
      applyConfig(payload);
      if (Number.isFinite(payload.estimated_subscribers_count)) {
        renderCount(payload.estimated_subscribers_count);
      }
    }

    async function refresh() {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/subs`, { cache: "no-store" });
        const j = await r.json().catch(() => null);
        if (j) applySubsPayload(j);
      } catch {}
    }

    (async () => {
      if (!API_BASE) return;
      try {
        const c = await fetch(`${API_BASE}/config`, { cache: "no-store" });
        const cj = await c.json().catch(() => null);
        if (cj?.ok) applyConfig(cj);
      } catch {}
      await refresh();
    })();

    setInterval(refresh, 60_000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail?.active) refresh(); });

    if (OVERLAY_KEY) {
      const WS_URL = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?key=" + encodeURIComponent(OVERLAY_KEY);
      let ws = null;
      function connectWS() {
        try { if (ws) ws.close(); } catch {}
        ws = new WebSocket(WS_URL);
        ws.onmessage = (evt) => {
          try {
            const data = JSON.parse(evt.data);
            if (data.type === "config" || data.type === "subs") {
              applySubsPayload(data);
            }
          } catch {}
        };
        ws.onerror = () => { try { ws.close(); } catch {} };
        ws.onclose = () => setTimeout(connectWS, 10000);
      }
      connectWS();
    }
  </script>
</body>
</html>
