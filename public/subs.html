<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <title>Sub Counter</title>
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
    :root {
      --accent: #7c3aed;
      --secondary: #121228;
      --wheel-opacity: 0.9;
      --counter-bg: rgba(17,17,17,0.92);
    }

    .subs-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      padding: 18px 32px 20px;
      border-radius: 16px;
      background: var(--counter-bg);
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      min-width: 220px;
    }

    /* header */
    .subs-overlay .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* main count */
    .subs-overlay .count-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      line-height: 1;
      margin-bottom: 12px;
    }
    .subs-overlay .current {
      font-size: 52px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #fff;
      transition: color .3s ease;
    }
    .subs-overlay .current.pop { color: var(--accent); }

    /* target (optional) */
    .subs-overlay .separator {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255,255,255,.35);
    }
    .subs-overlay .target {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,.5);
    }
    .subs-overlay.no-target .separator,
    .subs-overlay.no-target .target { display: none; }

    /* progress bar */
    .subs-overlay .bar-wrap {
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .subs-overlay .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width .6s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .subs-overlay.no-target .bar-wrap { display: none; }

    /* bottom label */
    .subs-overlay .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,.4);
    }
  </style>
</head>
<body>
  <div id="subsOverlay" class="subs-overlay">
    <div class="header">
      <i class="fi fi-rr-star" aria-hidden="true"></i>
      <span id="overlayTitle">Subskrybenci</span>
    </div>
    <div class="count-row">
      <span class="current" id="currentCount">–</span>
      <span class="separator">/</span>
      <span class="target" id="targetCount">100</span>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="label" id="overlayLabel">aktywne subskrypcje</div>
  </div>

  <script>
    // ── URL params ────────────────────────────────────────────────────
    // Required: ?key=OVERLAY_KEY
    // Optional: ?target=500 &accent=#7c3aed &bg=#111111 &opacity=0.92
    //           &title=Subsy &label=aktywne+subskrypcje
    const params = new URLSearchParams(location.search);

    const OVERLAY_KEY = (() => {
      const m = location.pathname.match(/^\/subs\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : params.get("key") || "";
    })();

    const API_BASE = OVERLAY_KEY ? `/overlay/${OVERLAY_KEY}` : "";

    let target = parseInt(params.get("target"), 10);
    if (!Number.isFinite(target) || target < 1) target = 0;

    // ── Apply color overrides from URL ────────────────────────────────
    const accentParam = params.get("accent");
    const bgParam     = params.get("bg");
    const opParam     = params.get("opacity");

    function hexToRgba(hex, op) {
      hex = hex.startsWith("#") ? hex : "#" + hex;
      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${Math.max(0.05,Math.min(1, parseFloat(op)||0.92))})`;
    }

    if (accentParam && /^#[0-9a-fA-F]{6}$/.test(accentParam)) {
      document.documentElement.style.setProperty("--accent", accentParam);
    }
    if (bgParam) {
      const rgba = hexToRgba(bgParam, opParam ?? "0.92");
      if (rgba) document.documentElement.style.setProperty("--counter-bg", rgba);
    }

    const titleParam = params.get("title");
    const labelParam = params.get("label");
    if (titleParam) document.getElementById("overlayTitle").textContent = titleParam;
    if (labelParam) document.getElementById("overlayLabel").textContent = labelParam;

    // ── DOM refs ──────────────────────────────────────────────────────
    const overlayEl  = document.getElementById("subsOverlay");
    const currentEl  = document.getElementById("currentCount");
    const targetEl   = document.getElementById("targetCount");
    const barFillEl  = document.getElementById("barFill");

    let lastValue = null;

    function render(count) {
      if (count === null || count === undefined) return;

      const popped = lastValue !== null && count !== lastValue;
      lastValue = count;

      currentEl.textContent = count;

      if (target > 0) {
        overlayEl.classList.remove("no-target");
        targetEl.textContent = target;
        const pct = Math.min(100, Math.round((count / target) * 100));
        barFillEl.style.width = pct + "%";
      } else {
        overlayEl.classList.add("no-target");
      }

      if (popped) {
        currentEl.classList.add("pop");
        setTimeout(() => currentEl.classList.remove("pop"), 600);
      }
    }

    // ── Apply colors from backend config ──────────────────────────────
    function applyConfigColors(cfg) {
      if (!cfg) return;
      // Only apply if not overridden by URL params
      if (!accentParam && cfg.accent_color && /^#[0-9a-fA-F]{6}$/.test(cfg.accent_color)) {
        document.documentElement.style.setProperty("--accent", cfg.accent_color);
      }
      if (!bgParam && cfg.secondary_color && /^#[0-9a-fA-F]{6}$/.test(cfg.secondary_color)) {
        const op = cfg.wheel_opacity ?? 0.92;
        const rgba = hexToRgba(cfg.secondary_color, op);
        if (rgba) document.documentElement.style.setProperty("--counter-bg", rgba);
      }
    }

    // ── Fetch sub count from backend ──────────────────────────────────
    async function fetchSubCount() {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/subs`, { cache: "no-store" });
        if (!r.ok) return;
        const j = await r.json();
        if (j?.ok && Number.isFinite(j.active_subscribers_count)) {
          render(j.active_subscribers_count);
        }
      } catch (e) {
        console.warn("[SUBS] fetch error:", e);
      }
    }

    // ── Startup: load config colors then fetch count ──────────────────
    (async () => {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/config`, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j?.ok) applyConfigColors(j);
        }
      } catch {}
      await fetchSubCount();
    })();

    // Poll every 60 seconds (Kick API rate limits are lenient but not unlimited)
    setInterval(fetchSubCount, 60_000);

    // Wake-up checks for OBS
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchSubCount();
    });
    window.addEventListener("obsSourceActiveChanged", (e) => {
      if (e.detail?.active) fetchSubCount();
    });

    // ── WebSocket: react to config changes ────────────────────────────
    if (OVERLAY_KEY) {
      const WS_URL = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?key=" + encodeURIComponent(OVERLAY_KEY);
      let ws = null;

      function connectWS() {
        try { if (ws) ws.close(); } catch {}
        ws = new WebSocket(WS_URL);
        ws.onopen = () => console.log("[SUBS WS] connected");
        ws.onmessage = (evt) => {
          try {
            const data = JSON.parse(evt.data);
            if (data.type === "config") {
              applyConfigColors(data);
            }
          } catch {}
        };
        ws.onerror = () => { try { ws.close(); } catch {} };
        ws.onclose = () => setTimeout(connectWS, 10_000);
      }

      connectWS();
    }
  </script>
</body>
</html>
